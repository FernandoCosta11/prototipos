      const titulo = normalizar(busca.busca) ? 'Instituições encontradas' : 'Instituições no diretório';
      return `<section class="secao" aria-labelledby="tit-achadas">
          <h2 class="rotulo-secao" id="tit-achadas">${titulo}</h2>
          <ul class="escolhas">${itens}</ul>
        </section>`;
    }

    /**
     * Tela Confirmar com a instituição (RF08, RF10).
     * @returns {PartesDaTela}
     */
    function montarConfirmarInstituicao() {
      const verificacao = verificacaoAtual();
      const conteudo = `
        <h1 class="titulo" id="titulo-tela" tabindex="-1">Confirmar com a instituição</h1>
        <p class="intro">Fale com a instituição por um canal que você mesmo procurou. Não use telefone, link ou perfil que veio na mensagem.</p>
        <div class="campo">
          <label class="rotulo" for="inst-busca">Nome da instituição</label>
          <p class="dica" id="dica-busca">Digite o nome para buscar no diretório. Neste protótipo: Banco Exemplo, Loja Exemplo e Operadora Exemplo.</p>
          <div class="busca">
            ${icone('lupa', 20)}
            <input class="entrada" id="inst-busca" type="search" autocomplete="off" data-campo="inst-busca"
              aria-describedby="dica-busca" value="${escapar(verificacao.inst.busca)}">
          </div>
        </div>
        <div id="inst-regiao">${montarRegiaoInstituicao(verificacao)}</div>`;
      return { conteudo, acoes: montarRegistro(verificacao) };
    }

    /**
     * Tela Confirmar com a pessoa (RF09, RF10).
     * @returns {PartesDaTela}
     */
    function montarConfirmarPessoa() {
      const conteudo = `
        <h1 class="titulo" id="titulo-tela" tabindex="-1">Confirmar com a pessoa</h1>
        <p class="intro">Antes de responder ou de enviar qualquer coisa, confirme que é a pessoa mesmo.</p>
        <ol class="orientacoes">
          <li class="orientacao"><div>
            <strong>Ligue para o número que você já tinha salvo</strong>
            <span>Use o contato antigo da sua agenda. Se a pessoa atender, pergunte se foi ela que escreveu.</span>
          </div></li>
          <li class="orientacao"><div>
            <strong>Não responda pelo número novo</strong>
            <span>Enquanto não confirmar, não mande mensagem, dinheiro nem código para o número novo.</span>
          </div></li>
          <li class="orientacao"><div>
            <strong>Faça uma pergunta que só a pessoa saberia</strong>
            <span>Por exemplo: "Onde a gente se viu pela última vez?". Evite perguntas que dá para descobrir nas redes sociais.</span>
          </div></li>
        </ol>`;
      return { conteudo, acoes: montarRegistro(verificacaoAtual()) };
    }

    /**
     * Tela Ver o que fazer agora (RF11, RF12).
     * @returns {PartesDaTela}
     */
    function montarPassos() {
      const ajuda = estado.sessao.ajuda;
      const acolhimento = `<div class="acolhimento">${icone('coracao', 28)}<p>Acontece com muita gente. Agir rápido é o que mais importa.</p></div>`;
      let corpo;

      if (!ajuda.situacao) {
        const escolhas = SITUACOES.map((situacao) => `
          <li><button type="button" class="escolha escolha--sem-icone" id="sit-${situacao.id}" data-acao="situacao" data-valor="${situacao.id}">
            <span class="escolha__texto"><strong>${situacao.rotulo}</strong><span>${situacao.dica}</span></span>
            ${icone('seta-dir', 20)}
          </button></li>`).join('');
        corpo = `<section class="secao" aria-labelledby="tit-situacao">
            <h2 class="subtitulo" id="tit-situacao" tabindex="-1">O que aconteceu até agora?</h2>
            <p class="dica">Escolha a opção mais parecida com a sua situação para ver o passo a passo.</p>
            <ul class="escolhas">${escolhas}</ul>
          </section>`;
      } else {
        const situacao = SITUACAO_POR_ID[ajuda.situacao];
        const marcados = ajuda.marcados[situacao.id] || [];
        const feitos = marcados.filter(Boolean).length;
        const passos = situacao.passos.map((passo, indice) => `
          <li class="passo${marcados[indice] ? ' passo--feito' : ''}">
            <label class="passo__marca" for="passo-${indice}">
              <input type="checkbox" id="passo-${indice}" data-campo="passo" data-indice="${indice}"${marcados[indice] ? ' checked' : ''}>
              <span class="passo__texto"><strong>${indice + 1}. ${passo.titulo}</strong><span>${passo.detalhe}</span></span>
            </label>
            ${passo.apoio ? botao({ acao: passo.apoio, rotulo: ROTULOS_APOIO[passo.apoio], estilo: 'mini', id: `apoio-${indice}` }) : ''}
          </li>`).join('');
        corpo = `
          <div class="situacao-escolhida">
            <p><span class="dica">Sua situação</span><strong>${situacao.rotulo}</strong></p>
            <button type="button" class="botao botao--mini" id="btn-trocar-situacao" data-acao="trocar-situacao">Trocar<span class="sr-only"> situação</span></button>
          </div>
          <section class="secao" aria-labelledby="tit-passos">
            <h2 class="subtitulo" id="tit-passos" tabindex="-1">Passo a passo</h2>
            <p class="dica" role="status">${feitos} de ${situacao.passos.length} passos feitos. Marque cada passo quando terminar.</p>
            <ol class="checklist">${passos}</ol>
          </section>`;
      }

      const conteudo = `
        <h1 class="titulo" id="titulo-tela" tabindex="-1">Ver o que fazer agora</h1>
        ${acolhimento}
        ${corpo}`;
      const acoes = botao({ acao: 'concluir', rotulo: 'Concluir', icone: 'check', id: 'btn-concluir' });
      return { conteudo, acoes };
    }

    /**
     * Tela Canais de ajuda (RF13).
     * @returns {PartesDaTela}
     */
    function montarCanais() {
      const cartoes = CANAIS_AJUDA.map((canal) => `
        <section class="cartao" aria-labelledby="canal-${canal.id}">
          <div class="canal__topo">
            <span class="canal__icone" aria-hidden="true">${icone(canal.icone, 24)}</span>
            <h2 class="subtitulo" id="canal-${canal.id}">${canal.nome}</h2>
          </div>
          <p>${canal.para}</p>
          <div class="canal__contato">
            <span class="dica">Contato oficial (fictício, só de exemplo)</span>
            <span>${canal.contato.rotulo}</span>
            <strong>${enderecoQuebravel(canal.contato.valor)}</strong>
            <span class="dica">${canal.nota}</span>
          </div>
          <div>
            <h3 class="rotulo-secao">Tenha em mãos</h3>
            <ul class="lista-marcada">${canal.emMaos.map((item) => `<li>${icone('check', 18)}<span>${item}</span></li>`).join('')}</ul>
          </div>
        </section>`).join('');

      const conteudo = `
        <h1 class="titulo" id="titulo-tela" tabindex="-1">Canais de ajuda</h1>
        <p class="intro">Fale com quem pode ajudar. Separe antes o que cada canal costuma pedir.</p>
        ${cartoes}`;
      const acoes = telaAnterior() === 'passos'
        ? botao({ acao: 'voltar', rotulo: 'Voltar ao passo a passo', icone: 'seta-esq' }) : '';
      return { conteudo, acoes };
    }

    /**
     * Monta o resumo de um relato já salvo ou enviado.
     * @param {Relato} relato
     * @returns {string}
     */
    function montarResumoRelato(relato) {
      const remetente = REMETENTE_POR_ID[relato.remetente];
      return `<dl class="resumo">
          <div><dt>Tipo</dt><dd>${TIPO_POR_ID[relato.tipo].rotulo}</dd></div>
          <div><dt>Quem o remetente dizia ser</dt><dd>${remetente ? remetente.rotulo : 'Não informado'}</dd></div>
          <div><dt>O que foi pedido</dt><dd>${descreverPedidos(relato.pedidos)}</dd></div>
          <div><dt>Texto do relato</dt><dd class="citacao">${escapar(relato.texto)}</dd></div>
          <div><dt>Identificação</dt><dd>${relato.identificado ? `Identificado como ${escapar(relato.nome.trim())}` : 'Anônimo'}</dd></div>
        </dl>`;
    }

    /**
     * Monta o controle "Simular falha de conexão", que só existe no protótipo.
     * @returns {string}
     */
    function montarControleDeFalha() {
      return `<section class="prototipo" aria-label="Recurso do protótipo">
          <p class="prototipo__selo">${icone('frasco', 18)}Recurso do protótipo</p>
          ${opcao({ controle: 'checkbox', id: 'falha-conexao', nome: 'falha-conexao', campo: 'falha-conexao', valor: '1',
            marcada: estado.falhaConexao, rotulo: 'Simular falha de conexão', descritoPor: 'dica-falha' })}
          <p class="dica" id="dica-falha">Com a opção marcada, o envio falha e o relato fica salvo para depois.</p>
        </section>`;
    }

    /**
     * Tela Relatar a tentativa (RF14).
     * @returns {PartesDaTela}
     */
    function montarRelatar() {
      const relato = estado.sessao.relato;
      const voltar = { acao: 'voltar', rotulo: 'Voltar ao passo a passo', icone: 'seta-esq' };
      const titulo = '<h1 class="titulo" id="titulo-tela" tabindex="-1">Relatar a tentativa</h1>';

      if (relato.envio === 'enviado') {
        const conteudo = `${titulo}
          <div class="aviso aviso--sucesso" id="relato-status" tabindex="-1" role="status">${icone('circulo-check')}<div>
            <p><strong>Relato enviado.</strong></p>
            <p>Obrigado. Ele vai virar alerta para outras pessoas, sem mostrar quem relatou.</p>
          </div></div>
          <section class="cartao" aria-label="O que foi enviado">${montarResumoRelato(relato)}</section>`;
        return { conteudo, acoes: botao(voltar) };
      }

      if (relato.envio === 'pendente') {
        const conteudo = `${titulo}
          <div class="aviso aviso--alerta" id="relato-status" tabindex="-1" role="status">${icone('sem-sinal')}<div>
            <p><strong>${relato.tentativas > 1 ? 'Ainda sem conexão.' : 'Sem conexão.'} Seu relato foi salvo neste aparelho.</strong></p>
            <p>Ele ainda não foi enviado. Quando a conexão voltar, toque em "Tentar enviar agora".</p>
          </div></div>
          <section class="cartao" aria-label="Relato salvo para envio posterior">${montarResumoRelato(relato)}</section>
          ${montarControleDeFalha()}`;
        const acoes = botao({ acao: 'tentar-enviar', rotulo: 'Tentar enviar agora', icone: 'enviar', id: 'btn-tentar' })
          + botao({ ...voltar, estilo: 'secundario' });
        return { conteudo, acoes };
      }

      const tipos = TIPOS.map((tipo) =>
        `<option value="${tipo.id}"${relato.tipo === tipo.id ? ' selected' : ''}>${tipo.rotulo}</option>`).join('');
      const remetentes = [`<option value=""${relato.remetente ? '' : ' selected'}>Não informado</option>`]
        .concat(REMETENTES.map((remetente) =>
          `<option value="${remetente.id}"${relato.remetente === remetente.id ? ' selected' : ''}>${remetente.rotulo}</option>`)).join('');

      const identificacao = [
        { id: 'anonimo', rotulo: 'Anônimo', dica: 'Ninguém fica sabendo quem enviou', marcada: !relato.identificado },
        { id: 'identificado', rotulo: 'Identificado', dica: 'Seu nome vai junto, só para quem analisa o relato', marcada: relato.identificado },
      ].map((item) => opcao({
        controle: 'radio', id: `ident-${item.id}`, nome: 'identificacao', campo: 'relato-identificacao',
        valor: item.id, marcada: item.marcada, rotulo: item.rotulo, dica: item.dica,
      })).join('');

      const campoNome = relato.identificado ? `
        <div class="campo">
          <label class="rotulo" for="relato-nome">Seu nome</label>
          <p class="dica" id="dica-nome">O nome nunca aparece no alerta que os outros usuários veem.</p>
          <input class="entrada" id="relato-nome" type="text" autocomplete="name" data-campo="relato-nome"
            aria-describedby="dica-nome${relato.erros.nome ? ' erro-nome' : ''}"${relato.erros.nome ? ' aria-invalid="true"' : ''} value="${escapar(relato.nome)}">
          ${relato.erros.nome ? erroDeCampo('erro-nome', 'Falta o seu nome. Escreva o nome ou escolha "Anônimo" para enviar sem se identificar.') : ''}
        </div>` : '';

      const conteudo = `${titulo}
        <div class="aviso aviso--info">${icone('pessoas')}<p>Seu relato vira um alerta para outras pessoas que receberem algo parecido. <strong>O alerta nunca mostra quem relatou.</strong></p></div>

        <p class="intro">${verificacaoAtual() ? 'Já preenchemos com os dados da sua verificação. Mude o que quiser antes de enviar.' : 'Conte o que aconteceu. Você pode mudar tudo antes de enviar.'}</p>

        <div class="campo">
          <label class="rotulo" for="relato-tipo">Tipo de comunicação</label>
          <select class="entrada" id="relato-tipo" data-campo="relato-tipo">${tipos}</select>
        </div>
        <div class="campo">
          <label class="rotulo" for="relato-remetente">Quem o remetente dizia ser</label>
          <select class="entrada" id="relato-remetente" data-campo="relato-remetente">${remetentes}</select>
        </div>
        ${grupoDePedidos({ prefixo: 'relped', campo: 'relato-pedido', legenda: 'O que foi pedido', marcados: relato.pedidos })}
        <div class="campo">
          <label class="rotulo" for="relato-texto">Texto do relato</label>
          <p class="dica" id="dica-relato">Apague nomes ou dados que você não queira enviar.</p>
          <textarea class="entrada" id="relato-texto" rows="5" data-campo="relato-texto"
            aria-describedby="dica-relato${relato.erros.texto ? ' erro-relato' : ''}"${relato.erros.texto ? ' aria-invalid="true"' : ''}>${escapar(relato.texto)}</textarea>
          ${relato.erros.texto ? erroDeCampo('erro-relato', 'Falta o texto do relato. Cole a mensagem recebida ou conte em poucas palavras o que aconteceu.') : ''}
        </div>

        <fieldset class="grupo">
          <legend>Como você quer enviar</legend>
          <div class="opcoes">${identificacao}</div>
        </fieldset>
        ${campoNome}
        ${montarControleDeFalha()}`;

      const acoes = botao({ acao: 'enviar-relato', rotulo: 'Enviar relato', icone: 'enviar', id: 'btn-enviar' });
      return { conteudo, acoes };
    }

    /**
     * Tela Avisar os contatos (RF15).
     * @returns {PartesDaTela}
     */
    function montarAvisar() {
      const aviso = estado.sessao.aviso;
      const status = aviso.compartilhado ? `
        <div class="aviso aviso--sucesso" id="aviso-status" tabindex="-1" role="status">${icone('circulo-check')}<div>
          <p><strong>Compartilhamento simulado.</strong></p>
          <p>No aplicativo real, abriria a lista de aplicativos do celular para você escolher os contatos.</p>
        </div></div>` : '';

      const conteudo = `
        <h1 class="titulo" id="titulo-tela" tabindex="-1">Avisar os contatos</h1>
        <p class="intro">Avise as pessoas próximas para que não caiam no mesmo golpe. Você pode mudar o texto antes de compartilhar.</p>
        <div class="campo">
          <label class="rotulo" for="aviso-texto">Mensagem de alerta</label>
          <p class="dica" id="dica-aviso">A mensagem já vem pronta. Edite se quiser.</p>
          <textarea class="entrada" id="aviso-texto" rows="7" data-campo="aviso-texto"
            aria-describedby="dica-aviso${aviso.erro ? ' erro-aviso' : ''}"${aviso.erro ? ' aria-invalid="true"' : ''}>${escapar(aviso.texto)}</textarea>
          ${aviso.erro ? erroDeCampo('erro-aviso', 'Falta a mensagem. Escreva o alerta que você quer mandar para os seus contatos.') : ''}
        </div>
        ${status}
        <section class="prototipo" aria-label="Recurso do protótipo">
          <p class="prototipo__selo">${icone('frasco', 18)}Recurso do protótipo</p>
          <p class="dica">O compartilhamento é simulado: nenhuma mensagem sai deste aparelho.</p>
        </section>`;

      const voltar = { acao: 'voltar', rotulo: 'Voltar ao passo a passo', icone: 'seta-esq' };
      const compartilhar = { acao: 'compartilhar', rotulo: 'Compartilhar', icone: 'compartilhar', id: 'btn-compartilhar' };
      const acoes = aviso.compartilhado
        ? botao(voltar) + botao({ ...compartilhar, rotulo: 'Compartilhar de novo', estilo: 'secundario' })
        : botao(compartilhar);
      return { conteudo, acoes };
    }

    /**
     * Tela Conhecer os sinais de alerta (RF16).
     * @returns {PartesDaTela}
     */
    function montarSinais() {
      const veioDoResultado = telaAnterior() === 'resultado';
      const parecido = veioDoResultado ? golpeParecido(verificacaoAtual()) : null;

      const golpes = GOLPES.map((golpe) => `
        <details class="sanfona" id="golpe-${golpe.id}"${golpe.id === parecido ? ' open' : ''}>
          <summary>
            <span class="golpe__icone" aria-hidden="true">${icone(golpe.icone)}</span>
            <h2 class="sanfona__titulo">
              <span>${golpe.nome}</span>
              ${golpe.id === parecido ? '<span class="etiqueta">Parecido com o seu caso</span>' : ''}
            </h2>
            ${icone('seta-baixo', 20, 'seta')}
          </summary>
          <div class="sanfona__corpo">
            <div><h3>Como funciona</h3><p>${golpe.como}</p></div>
            <div><h3>Sinais</h3><ul class="lista-marcada">${golpe.sinais.map((sinal) => `<li>${icone('triangulo', 18)}<span>${sinal}</span></li>`).join('')}</ul></div>
            <div><h3>Exemplo</h3><blockquote class="citacao">${golpe.exemplo}</blockquote></div>
            <div><h3>Como confirmar</h3><p>${golpe.confirmar}</p></div>
          </div>
        </details>`).join('');

      const conteudo = `
        <h1 class="titulo" id="titulo-tela" tabindex="-1">Conhecer os sinais de alerta</h1>
        <p class="intro">Veja como funcionam os golpes mais comuns. Toque em um tipo para abrir.</p>
        ${golpes}`;

      const acoes = veioDoResultado
        ? botao({ acao: 'voltar', rotulo: 'Voltar ao resultado', icone: 'seta-esq' })
        : botao({ acao: 'verificar', rotulo: 'Verificar uma comunicação', icone: 'lupa' });
      return { conteudo, acoes };
    }

    /**
     * Mapa das telas. `passo` indica a posição no fluxo de verificação (0 = fora dele).
     * Para criar uma tela nova, basta acrescentar uma entrada aqui.
     * @type {Object<string, {titulo: string, passo: number, montar: function(): PartesDaTela}>}
     */
    const TELAS = {
      'inicio': { titulo: 'Início', passo: 0, montar: montarInicio },
      'informar': { titulo: 'Informar a comunicação', passo: 1, montar: montarInformar },
      'perguntas': { titulo: 'Perguntas rápidas', passo: 2, montar: montarPerguntas },
      'resultado': { titulo: 'Resultado', passo: 3, montar: montarResultado },
      'conf-inst': { titulo: 'Confirmar com a instituição', passo: 0, montar: montarConfirmarInstituicao },
      'conf-pessoa': { titulo: 'Confirmar com a pessoa', passo: 0, montar: montarConfirmarPessoa },
      'passos': { titulo: 'Ver o que fazer agora', passo: 0, montar: montarPassos },
      'canais': { titulo: 'Canais de ajuda', passo: 0, montar: montarCanais },
      'relatar': { titulo: 'Relatar a tentativa', passo: 0, montar: montarRelatar },
      'avisar': { titulo: 'Avisar os contatos', passo: 0, montar: montarAvisar },
      'sinais': { titulo: 'Conhecer os sinais de alerta', passo: 0, montar: montarSinais },
    };

    /* ========================================================================
     * 9. Navegação
     * ====================================================================== */

    /**
     * Id da tela aberta.
     * @returns {string}
     */
    function telaAtual() {
      return estado.pilha[estado.pilha.length - 1];
    }

    /**
     * Id da tela de onde o usuário veio.
     * @returns {?string}
     */
    function telaAnterior() {
      return estado.pilha.length > 1 ? estado.pilha[estado.pilha.length - 2] : null;
    }

    /**
     * Abre uma tela, guardando a atual para o botão Voltar.
     * @param {string} tela
     */
    function ir(tela) {
      if (telaAtual() === tela) return;
      if (telaAtual() === 'inicio') estado.avisoInicio = '';
      estado.pilha.push(tela);
      desenhar();
    }

    /**
     * Volta uma tela. Em "Perguntas rápidas", volta primeiro para a pergunta anterior.
     * Os dados já informados continuam no estado (RNF06).
     */
    function voltar() {
      const verificacao = verificacaoAtual();
      if (telaAtual() === 'perguntas' && verificacao && verificacao.perguntaAtual > 0) {
        verificacao.perguntaAtual -= 1;
        desenhar({ foco: 'pergunta-texto' });
        return;
      }
      if (estado.pilha.length <= 1) return;
      estado.pilha.pop();
      if (telaAtual() === 'inicio') {
        estado.sessao = null;
        estado.avisoInicio = '';
      }
      desenhar();
    }

    /**
     * Volta direto ao Início e descarta o que não foi salvo.
     * @param {string} aviso Mensagem de confirmação a mostrar no Início (pode ser vazia).
     */
    function irParaInicio(aviso) {
      estado.pilha = ['inicio'];
      estado.sessao = null;
      estado.avisoInicio = aviso;
      desenhar();
    }

    /**
     * Encerramento (seção 5): salva a verificação e volta ao Início.
     * @param {string} avisoNova Mensagem para quando a verificação entra no histórico agora.
     */
    function encerrar(avisoNova) {
      const situacao = salvarSessao();
      const aviso = situacao === 'nova' ? avisoNova
        : situacao === 'atualizada' ? 'Verificação atualizada em "Suas verificações".'
          : 'Passo a passo concluído. Se precisar de ajuda de novo, é só voltar.';
      irParaInicio(aviso);
    }

    /* ========================================================================
     * 10. Ações (toques) e campos (mudanças de valor)
     * ====================================================================== */

    /**
     * Valida a tela "Informar a comunicação" e avança para as perguntas (RF04).
     * Se faltar conteúdo ou remetente, mostra o erro no campo e não avança.
     */
    function continuarInformar() {
      const verificacao = verificacaoAtual();
      const erros = {};
      if (!verificacao.conteudo.trim()) erros.conteudo = true;
      if (!verificacao.remetente) erros.remetente = true;
      verificacao.erros = erros;

      if (erros.conteudo || erros.remetente) {
        atualizar();
        focarComRolagem(erros.conteudo ? 'campo-conteudo' : 'rem-pessoa');
        return;
      }
      const primeiraSemResposta = verificacao.respostas.indexOf(null);
      verificacao.perguntaAtual = primeiraSemResposta === -1 ? 0 : primeiraSemResposta;
      ir('perguntas');
    }

    /**
     * Registra a resposta da pergunta em exibição. Na última, calcula o risco e
     * abre o Resultado na mesma hora (RNF08).
     * @param {Resposta} valor
     */
    function responder(valor) {
      const verificacao = verificacaoAtual();
      verificacao.respostas[verificacao.perguntaAtual] = valor;
      if (verificacao.perguntaAtual < PERGUNTAS.length - 1) {
        verificacao.perguntaAtual += 1;
        desenhar({ foco: 'pergunta-texto' });
        return;
      }
      verificacao.risco = Risco.calcular(verificacao);
      verificacao.data = new Date();
      ir('resultado');
    }

    /**
     * Abre "Confirmar com a instituição". Na primeira vez, sugere na busca a
     * instituição citada no texto informado, se ela estiver no diretório.
     */
    function abrirConfirmarInstituicao() {
      const verificacao = verificacaoAtual();
      if (!verificacao.inst.iniciada) {
        verificacao.inst.iniciada = true;
        const texto = normalizar(verificacao.conteudo);
        const citada = INSTITUICOES.find((instituicao) => texto.includes(normalizar(instituicao.nome)));
        if (citada) verificacao.inst.busca = citada.nome;
      }
      ir('conf-inst');
    }

    /**
     * Compara o contato digitado com os canais oficiais da instituição aberta.
     */
    function compararContato() {
      const verificacao = verificacaoAtual();
      const instituicao = INSTITUICAO_POR_ID[verificacao.inst.selecionada];
      const contato = verificacao.inst.contato.trim();
      verificacao.inst.comparacao = contato
        ? { ...Comparador.comparar(contato, instituicao), contato }
        : { vazio: true };
      document.getElementById('inst-comparacao').innerHTML = montarComparacao(verificacao.inst.comparacao, instituicao);
      if (!contato) focar('inst-contato');
    }

    /**
     * Registra o resultado da confirmação (RF10): legítimo encerra; golpe ou
     * não confirmado leva ao passo a passo.
     * @param {Confirmacao} valor
     */
    function registrarConfirmacao(valor) {
      verificacaoAtual().confirmacao = valor;
      if (valor === 'legitimo') {
        encerrar('Verificação salva como legítima em "Suas verificações".');
        return;
      }
      ir('passos');
    }

    /**
     * Valida o relato e tenta enviar. Só é chamada por toque do usuário (RNF05).
     */
    function enviarRelato() {
      const relato = estado.sessao.relato;
      const erros = {};
      if (!relato.texto.trim()) erros.texto = true;
      if (relato.identificado && !relato.nome.trim()) erros.nome = true;
      relato.erros = erros;
      if (erros.texto || erros.nome) {
        atualizar();
        focarComRolagem(erros.texto ? 'relato-texto' : 'relato-nome');
        return;
      }
      tentarEnvioDoRelato();
    }

    /**
     * Simula o envio do relato. Com "Simular falha de conexão" ligado, o relato
     * fica salvo para envio posterior e o usuário é avisado (RF14).
     */
    function tentarEnvioDoRelato() {
      const relato = estado.sessao.relato;
      relato.tentativas += 1;
      relato.envio = estado.falhaConexao ? 'pendente' : 'enviado';
      desenhar({ foco: 'relato-status' });
    }

    /**
     * Simula o compartilhamento da mensagem de alerta (RF15).
     */
    function compartilharAviso() {
      const aviso = estado.sessao.aviso;
      if (!aviso.texto.trim()) {
        aviso.erro = true;
        atualizar();
        focarComRolagem('aviso-texto');
        return;
      }
      aviso.erro = false;
      aviso.compartilhado = true;
      desenhar({ foco: 'aviso-status' });
    }

    /**
     * Ações disparadas por toque em elementos com `data-acao`.
     * @type {Object<string, function(HTMLElement): void>}
     */
    const ACOES = {
      // Moldura
      'voltar': () => voltar(),
      'inicio': () => {
        if (telaAtual() === 'inicio') { el.conteudo.scrollTop = 0; return; }
        irParaInicio('');
      },
      'ajuda': () => ir('canais'),

      // Início
      'verificar': () => {
        estado.sessao = criarSessao(criarVerificacao(null));
        ir('informar');
      },
      'simular': (alvo) => {
        estado.sessao = criarSessao(criarVerificacao(EXEMPLOS[alvo.dataset.exemplo]));
        ir('informar');
      },
      'ja-cai': () => {
        estado.sessao = criarSessao(null);
        ir('passos');
      },
      'sinais': () => ir('sinais'),
      'abrir-salva': (alvo) => {
        const sessao = estado.historico.find((item) => String(item.verificacao.id) === alvo.dataset.id);
        if (!sessao) return;
        estado.sessao = sessao;
        ir('resultado');
      },

      // Verificação
      'continuar': () => continuarInformar(),
      'responder': (alvo) => responder(alvo.dataset.valor),

      // Resultado
      'confirmar-instituicao': () => abrirConfirmarInstituicao(),
      'confirmar-pessoa': () => ir('conf-pessoa'),
      'o-que-fazer': () => ir('passos'),
      'entender-sinal': () => ir('sinais'),
      'encerrar': () => encerrar('Verificação encerrada e salva em "Suas verificações".'),

      // Confirmações
      'selecionar-inst': (alvo) => {
        const busca = verificacaoAtual().inst;
        busca.selecionada = alvo.dataset.id;
        busca.comparacao = null;
        atualizar();
        focar('inst-nome');
      },
      'trocar-inst': () => {
        const busca = verificacaoAtual().inst;
        busca.selecionada = null;
        busca.busca = '';
        busca.contato = '';
        busca.comparacao = null;
        atualizar();
        focar('inst-busca');
      },
      'comparar': () => compararContato(),
      'registrar': (alvo) => registrarConfirmacao(alvo.dataset.valor),

      // Ver o que fazer agora
      'situacao': (alvo) => {
        estado.sessao.ajuda.situacao = alvo.dataset.valor;
        atualizar();
        focar('tit-passos');
      },
      'trocar-situacao': () => {
        estado.sessao.ajuda.situacao = null;
        atualizar();
        focar('tit-situacao');
      },
      'canais': () => ir('canais'),
      'relatar': () => { prepararRelato(); ir('relatar'); },
      'avisar': () => ir('avisar'),
      'concluir': () => encerrar('Verificação concluída e salva em "Suas verificações".'),

      // Relato e aviso
      'enviar-relato': () => enviarRelato(),
      'tentar-enviar': () => tentarEnvioDoRelato(),
      'compartilhar': () => compartilharAviso(),
    };

    /**
     * Tratadores de mudança em elementos com `data-campo`. Campos de texto só
     * atualizam o estado (sem redesenhar, para não atrapalhar a digitação);
     * opções redesenham a tela mantendo o foco.
     * @type {Object<string, function(HTMLInputElement): void>}
     */
    const CAMPOS = {
      // Informar a comunicação
      'tipo': (alvo) => {
        verificacaoAtual().tipo = alvo.value;
        atualizar();
      },
      'conteudo': (alvo) => {
        const verificacao = verificacaoAtual();
        verificacao.conteudo = alvo.value;
        if (verificacao.erros.conteudo && alvo.value.trim()) {
          delete verificacao.erros.conteudo;
          limparErroNoLugar('campo-conteudo', 'erro-conteudo');
        }
      },
      'remetente': (alvo) => {
        const verificacao = verificacaoAtual();
        verificacao.remetente = alvo.value;
        delete verificacao.erros.remetente;
        atualizar();
      },
      'pedido': (alvo) => {
        const verificacao = verificacaoAtual();
        verificacao.pedidos = alternarPedido(verificacao.pedidos, alvo.value, alvo.checked);
        atualizar();
      },

      // Confirmar com a instituição
      'inst-busca': (alvo) => {
        const verificacao = verificacaoAtual();
        verificacao.inst.busca = alvo.value;
        verificacao.inst.selecionada = null;
        verificacao.inst.comparacao = null;
        document.getElementById('inst-regiao').innerHTML = montarRegiaoInstituicao(verificacao);
        const quantidade = buscarInstituicoes(alvo.value).length;
        anunciar(quantidade === 1 ? '1 instituição encontrada' : `${quantidade} instituições encontradas`);
      },
      'inst-contato': (alvo) => {
        const busca = verificacaoAtual().inst;
        busca.contato = alvo.value;
        if (busca.comparacao) {
          busca.comparacao = null;
          document.getElementById('inst-comparacao').innerHTML = '';
        }
      },

      // Ver o que fazer agora
      'passo': (alvo) => {
        const ajuda = estado.sessao.ajuda;
        const marcados = ajuda.marcados[ajuda.situacao] || [];
        marcados[Number(alvo.dataset.indice)] = alvo.checked;
        ajuda.marcados[ajuda.situacao] = marcados;
        atualizar();
      },

      // Relatar a tentativa
      'relato-tipo': (alvo) => { estado.sessao.relato.tipo = alvo.value; },
      'relato-remetente': (alvo) => { estado.sessao.relato.remetente = alvo.value; },
      'relato-pedido': (alvo) => {
        const relato = estado.sessao.relato;
        relato.pedidos = alternarPedido(relato.pedidos, alvo.value, alvo.checked);
        atualizar();
      },
      'relato-texto': (alvo) => {
        const relato = estado.sessao.relato;
        relato.texto = alvo.value;
        if (relato.erros.texto && alvo.value.trim()) {
          delete relato.erros.texto;
          limparErroNoLugar('relato-texto', 'erro-relato');
        }
      },
      'relato-identificacao': (alvo) => {
        const relato = estado.sessao.relato;
        relato.identificado = alvo.value === 'identificado';
        delete relato.erros.nome;
        atualizar();
      },
      'relato-nome': (alvo) => {
        const relato = estado.sessao.relato;
        relato.nome = alvo.value;
        if (relato.erros.nome && alvo.value.trim()) {
          delete relato.erros.nome;
          limparErroNoLugar('relato-nome', 'erro-nome');
        }
      },
      'falha-conexao': (alvo) => {
        estado.falhaConexao = alvo.checked;
        atualizar();
      },

      // Avisar os contatos
      'aviso-texto': (alvo) => {
        const aviso = estado.sessao.aviso;
        aviso.texto = alvo.value;
        if (aviso.erro && alvo.value.trim()) {
          aviso.erro = false;
          limparErroNoLugar('aviso-texto', 'erro-aviso');
        }
      },
    };

    /**
     * Diz se o elemento é um campo de digitação (tratado no evento `input`).
     * Rádios, caixas e listas são tratados no evento `change`.
     * @param {EventTarget} alvo
     * @returns {boolean}
     */
    function ehCampoDeTexto(alvo) {
      if (alvo.tagName === 'TEXTAREA') return true;
      return alvo.tagName === 'INPUT' && alvo.type !== 'radio' && alvo.type !== 'checkbox';
    }

    /**
     * Encaminha a mudança de um campo para o tratador certo em CAMPOS.
     * @param {EventTarget} alvo
     */
    function tratarCampo(alvo) {
      const tratador = alvo.dataset ? CAMPOS[alvo.dataset.campo] : null;
      if (tratador) tratador(alvo);
    }

    /**
     * Liga os eventos uma única vez, na moldura. As telas são redesenhadas por
     * cima sem precisar religar nada (delegação de eventos).
     */
    function ligarEventos() {
      el.app.addEventListener('click', (evento) => {
        const alvo = evento.target.closest('[data-acao]');
        if (!alvo || !el.app.contains(alvo)) return;
        const acao = ACOES[alvo.dataset.acao];
        if (acao) acao(alvo);
      });

      el.app.addEventListener('input', (evento) => {
        if (ehCampoDeTexto(evento.target)) tratarCampo(evento.target);
      });

      el.app.addEventListener('change', (evento) => {
        if (!ehCampoDeTexto(evento.target)) tratarCampo(evento.target);
      });

      // Enter em um campo com `data-enter` dispara a ação indicada (ex.: comparar).
      el.app.addEventListener('keydown', (evento) => {
        const alvo = evento.target;
        if (evento.key !== 'Enter' || !alvo.dataset || !alvo.dataset.enter) return;
        evento.preventDefault();
        const acao = ACOES[alvo.dataset.enter];
        if (acao) acao(alvo);
      });
    }

    /* ========================================================================
     * 11. Partida
     * ====================================================================== */

    ligarEventos();
    desenhar({ manterFoco: true }); // primeira tela: não rouba o foco ao abrir a página

    // Módulos puros expostos só para conferência do protótipo pelo console
    // (por exemplo: ConfereAi.Risco.nivelPorPontos(7)). Não fazem parte da interface.
    window.ConfereAi = Object.freeze({ Risco, Comparador });
  })();
  </script>
</body>
