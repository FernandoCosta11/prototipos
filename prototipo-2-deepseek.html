<html lang="pt-BR">

<meta charset="utf-8">

<title>Confere Aí — protótipo</title>
<!--
  PROTÓTIPO "CONFERE AÍ" — Interação Humano-Computador
  Arquivo único, sem back-end, sem bibliotecas externas e sem chamadas de rede.
  Todos os dados ficam em memória (no dispositivo). Instituições e contatos são fictícios.

  SUPOSIÇÃO 1: o tipo de comunicação também é obrigatório em "Informar a comunicação",
  além do conteúdo e do remetente exigidos no RF04, porque o histórico e o relato
  precisam do tipo para ficarem legíveis.
  SUPOSIÇÃO 2: "Entender um sinal" (RF07) abre uma tela própria com a explicação
  detalhada de cada sinal encontrado no resultado.
  SUPOSIÇÃO 3: a opção "Nenhum" em "o que está sendo pedido" é exclusiva: ao marcá-la,
  as demais são desmarcadas, e vice-versa.
  SUPOSIÇÃO 4: ao "Concluir" em "Ver o que fazer agora" sem ter passado por uma
  verificação (entrada "Já caí ou quase caí"), o histórico recebe um registro genérico
  com o rótulo "O que fazer agora concluído".
  SUPOSIÇÃO 5: o histórico é mantido apenas em memória, conforme o formato da entrega
  ("dados em memória"), e por isso começa vazio a cada carregamento.
-->
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    color:#16211f;
    background:#e8ecea;
  }
  .app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:#fff;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 30px rgba(0,0,0,.10);
  }

  /* ---------- barra superior fixa (RF18) ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:6px 10px;background:#0b5c4e;color:#fff;
  }
  .marca{font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .topbtn{
    min-height:44px;min-width:44px;padding:0 10px;border-radius:10px;
    border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .topbtn:active{background:rgba(255,255,255,.16)}
  .topbtn-ajuda{background:#fff;color:#0b5c4e;border-color:#fff}
  .topbtn-ajuda:active{background:#d9e8e4}

  /* ---------- sub-barra: voltar + progresso ---------- */
  .subbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 16px;background:#f4f7f6;border-bottom:1px solid #e0e6e4;
  }
  .subbar:empty{display:none}
  .voltar{
    min-height:44px;padding:0 8px;border:none;border-radius:8px;background:transparent;
    color:#0b5c4e;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
  }
  .voltar:active{background:#e2ecea}
  .progresso{flex:1;min-width:150px}
  .barra{height:6px;border-radius:3px;background:#d7e0dd;overflow:hidden}
  .barra span{display:block;height:100%;background:#127a67;border-radius:3px}
  .progresso-texto{display:block;font-size:14px;color:#3c4a47;margin-top:4px}

  /* ---------- conteúdo ---------- */
  .tela{flex:1;padding:16px 16px 8px}
  .titulo-tela{font-size:22px;line-height:1.25;margin:0 0 6px;color:#0b3f36}
  .secao-titulo{font-size:17px;margin:22px 0 8px;color:#0b3f36}
  .ajuda{font-size:16px;color:#3c4a47;margin:0 0 16px}
  .texto-pequeno{font-size:15px;color:#3c4a47;margin:0 0 10px}
  .vazio{font-size:16px;color:#3c4a47;background:#f4f7f6;border-radius:12px;padding:14px;margin:0}

  /* ---------- início ---------- */
  .pausa{
    display:flex;gap:12px;align-items:flex-start;
    background:#e6f2ef;border-left:6px solid #127a67;border-radius:12px;
    padding:14px;margin:14px 0 18px;
  }
  .pausa-icone{font-size:20px;line-height:1.2}
  .pausa p{margin:0;font-size:17px;color:#0b3f36}
  .entradas{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}

  .proto{background:#f4f7f6;border:1px dashed #9fb5b0;border-radius:12px;padding:14px;margin-bottom:22px}
  .proto-titulo{font-size:15px;margin:0 0 6px;color:#0b3f36;text-transform:none}

  .historico{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .hist-item{
    width:100%;display:flex;flex-direction:column;gap:2px;text-align:left;
    min-height:44px;padding:12px 14px;border:1px solid #dfe6e4;border-radius:12px;
    background:#fff;font:inherit;cursor:pointer;
  }
  .hist-item:active{background:#f4f7f6}
  .hist-data{font-size:14px;color:#4a5855}
  .hist-tipo{font-size:16px;font-weight:600;color:#16211f}
  .hist-rotulo{font-size:15px;color:#0b5c4e;font-weight:600}

  /* ---------- formulários ---------- */
  .campo{margin-bottom:20px}
  .rotulo{display:block;font-size:16px;font-weight:600;margin-bottom:8px;color:#16211f}
  textarea,input[type=text]{
    width:100%;font:inherit;font-size:16px;padding:12px;min-height:48px;
    border:2px solid #b9c7c3;border-radius:12px;background:#fff;color:#16211f;
  }
  textarea{min-height:130px;resize:vertical}
  textarea:focus,input[type=text]:focus,.chip:focus,.btn:focus,.voltar:focus,.topbtn:focus{
    outline:3px solid #127a67;outline-offset:2px;
  }
  .invalido{border-color:#a3231b;background:#fdf3f2}
  .erro{
    margin:8px 0 0;font-size:15px;font-weight:600;color:#a3231b;
    display:flex;gap:6px;align-items:flex-start;
  }
  .resumo-erros{
    background:#fdecea;border-left:6px solid #a3231b;border-radius:12px;
    padding:12px 14px;margin-bottom:18px;color:#7d1a14;font-size:16px;
  }

  .opcoes{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    min-height:44px;padding:10px 16px;border-radius:24px;
    border:2px solid #b9c7c3;background:#fff;color:#16211f;
    font:inherit;font-size:16px;cursor:pointer;
  }
  .chip:active{background:#eef2f1}
  .chip[aria-pressed="true"]{
    border-color:#127a67;background:#e6f2ef;color:#0b3f36;font-weight:700;
  }
  .chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}

  /* ---------- perguntas rápidas ---------- */
  .pergunta{padding:14px 0;border-bottom:1px solid #e6ebe9}
  .pergunta:last-of-type{border-bottom:none}
  .pergunta-texto{margin:0 0 10px;font-size:17px;font-weight:600;color:#16211f;display:flex;gap:10px}
  .num{
    flex:none;width:26px;height:26px;border-radius:50%;background:#127a67;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  }
  .contador{font-size:15px;color:#3c4a47;margin:14px 0 0}

  /* ---------- resultado ---------- */
  .risco{display:flex;align-items:center;gap:12px;border-radius:14px;padding:16px;margin:10px 0 16px}
  .risco-icone{
    flex:none;width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  }
  .risco-nivel{display:block;font-size:20px;font-weight:800;line-height:1.2}
  .risco-pontos{display:block;font-size:15px;font-weight:500}
  .risco-baixo{background:#e7f6ea;color:#14622a}
  .risco-baixo .risco-icone{background:#14622a;color:#fff}
  .risco-medio{background:#fff4d6;color:#6b4b00}
  .risco-medio .risco-icone{background:#6b4b00;color:#fff}
  .risco-alto{background:#fdecea;color:#a3231b}
  .risco-alto .risco-icone{background:#a3231b;color:#fff}

  .recomendacao{
    background:#f4f7f6;border-left:6px solid #127a67;border-radius:12px;
    padding:14px;margin:0 0 8px;font-size:16px;color:#16211f;
  }
  .aviso-baixo{
    background:#fff4d6;border-radius:12px;padding:14px;margin:12px 0 0;
    font-size:16px;color:#6b4b00;border-left:6px solid #6b4b00;
  }

  .sinais-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .sinais-lista li{
    border:1px solid #dfe6e4;border-left:6px solid #127a67;border-radius:12px;
    padding:12px 14px;background:#fff;
  }
  .sinais-lista strong{display:block;font-size:16px;color:#16211f}
  .sinais-lista span{display:block;font-size:15px;color:#3c4a47;margin-top:2px}

  .sinal-detalhe{border:1px solid #dfe6e4;border-radius:12px;padding:14px;margin-bottom:10px}
  .sinal-detalhe h3{margin:0 0 6px;font-size:17px;color:#0b3f36}
  .sinal-detalhe p{margin:0;font-size:16px;color:#3c4a47}

  /* ---------- cards genéricos ---------- */
  .card{border:1px solid #dfe6e4;border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .card h3{margin:0 0 8px;font-size:17px;color:#0b3f36}
  .card p{margin:0 0 8px;font-size:16px;color:#16211f}
  .card p:last-child{margin-bottom:0}
  .card dl{margin:0;font-size:16px}
  .card dt{font-weight:700;color:#0b3f36;margin-top:10px}
  .card dt:first-child{margin-top:0}
  .card dd{margin:2px 0 0;color:#16211f;word-break:break-word}
  .etiqueta{
    display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:20px;
    background:#e6f2ef;color:#0b3f36;margin-bottom:8px;
  }

  /* ---------- passos ---------- */
  .passo{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    min-height:52px;padding:12px 14px;margin-bottom:8px;
    border:2px solid #dfe6e4;border-radius:12px;background:#fff;
    font:inherit;font-size:16px;color:#16211f;cursor:pointer;
  }
  .passo .caixa{
    flex:none;width:26px;height:26px;border-radius:7px;border:2px solid #7d8c89;
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;background:#fff;
  }
  .passo[aria-pressed="true"]{border-color:#127a67;background:#f0f8f6}
  .passo[aria-pressed="true"] .caixa{background:#127a67;border-color:#127a67}
  .passo[aria-pressed="true"] .texto{color:#0b3f36;text-decoration:line-through;text-decoration-thickness:2px}

  .acoes-linha{display:flex;flex-direction:column;gap:8px;margin-top:16px}

  /* ---------- acordeão de sinais de alerta ---------- */
  details.golpe{border:1px solid #dfe6e4;border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
  details.golpe summary{
    padding:14px;font-size:17px;font-weight:700;color:#0b3f36;cursor:pointer;
    min-height:44px;display:flex;align-items:center;gap:8px;list-style:none;
  }
  details.golpe summary::-webkit-details-marker{display:none}
  details.golpe summary::before{content:"▸";color:#127a67;font-size:15px}
  details.golpe[open] summary::before{content:"▾"}
  details.golpe .corpo{padding:0 14px 14px}
  details.golpe .corpo h4{margin:12px 0 4px;font-size:15px;color:#0b3f36;text-transform:uppercase;letter-spacing:.03em}
  details.golpe .corpo h4:first-child{margin-top:0}
  details.golpe .corpo p{margin:0;font-size:16px;color:#16211f}

  /* ---------- botões ---------- */
  .acoes{
    position:sticky;bottom:0;z-index:25;
    display:flex;flex-direction:column;gap:8px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid #e0e6e4;
  }
  .acoes:empty{display:none}
  .btn{
    display:block;width:100%;min-height:48px;padding:12px 14px;border-radius:12px;
    font:inherit;font-size:16px;font-weight:700;border:2px solid transparent;
    cursor:pointer;text-align:center;
  }
  .btn-primario{background:#127a67;color:#fff;border-color:#127a67}
  .btn-primario:active{background:#0b5c4e}
  .btn-secundario{background:#fff;color:#0b5c4e;border-color:#127a67}
  .btn-secundario:active{background:#e6f2ef}
  .btn-neutro{background:#eef2f1;color:#16211f;border-color:#b9c7c3}
  .btn-neutro:active{background:#e0e6e4}
  .btn-perigo{background:#a3231b;color:#fff;border-color:#a3231b}
  .btn-perigo:active{background:#7d1a14}

  /* ---------- relato ---------- */
  .status{
    border-radius:12px;padding:14px;margin-top:14px;font-size:16px;font-weight:600;
  }
  .status-ok{background:#e7f6ea;color:#14622a;border-left:6px solid #14622a}
  .status-espera{background:#fff4d6;color:#6b4b00;border-left:6px solid #6b4b00}

  .switch{
    display:flex;gap:12px;align-items:center;width:100%;min-height:48px;
    padding:12px 14px;border:2px solid #b9c7c3;border-radius:12px;background:#fff;
    font:inherit;font-size:16px;color:#16211f;cursor:pointer;text-align:left;
  }
  .switch .marca-switch{
    flex:none;width:46px;height:26px;border-radius:13px;background:#b9c7c3;position:relative;
  }
  .switch .marca-switch::after{
    content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:left .15s;
  }
  .switch[aria-pressed="true"] .marca-switch{background:#127a67}
  .switch[aria-pressed="true"] .marca-switch::after{left:23px}
</style>
</head>

  /* =========================================================
     UTILITÁRIOS
     ========================================================= */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtData(iso) {
    var d = new Date(iso);
    return d.toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function semAcento(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function navegar(tela, opts) {
    opts = opts || {};
    if (opts.limpar) {
      pilha = [tela];
    } else if (opts.substituir) {
      pilha[pilha.length - 1] = tela;
    } else if (pilha[pilha.length - 1] !== tela) {
      pilha.push(tela);
    }
    render();
    window.scrollTo(0, 0);
  }

  function voltar() {
    if (pilha.length > 1) {
      pilha.pop();
      render();
      window.scrollTo(0, 0);
    }
  }

  function telaAtual() {
    return pilha[pilha.length - 1];
  }

  function telaAnterior() {
    return pilha.length > 1 ? pilha[pilha.length - 2] : null;
  }

  /* =========================================================
     REGRA DE CÁLCULO DO RISCO (seção 4)
     ========================================================= */

  function calcularResultado(d) {
    var sinais = [];
    var pontos = 0;
    var i, r;

    for (i = 0; i < PERGUNTAS.length; i++) {
      r = d.respostas[i];
      if (r === 'sim') {
        pontos += 2;
        sinais.push(PERGUNTAS[i].sim);
      } else if (r === 'nao-sei') {
        pontos += 1;
        sinais.push(PERGUNTAS[i].incerto);
      }
    }

    var melhorPedido = 0;
    d.pedidos.forEach(function (p) {
      var def = null;
      for (var k = 0; k < PEDIDOS.length; k++) {
        if (PEDIDOS[k].id === p) { def = PEDIDOS[k]; }
      }
      if (!def) { return; }
      if (def.pontos > melhorPedido) { melhorPedido = def.pontos; }
      if (SINAIS_PEDIDO[p]) { sinais.push(SINAIS_PEDIDO[p]); }
    });
    pontos += melhorPedido;

    if (d.remetente === 'desconhecido') {
      pontos += 1;
      sinais.push(SINAL_DESCONHECIDO);
    }

    var risco = 'baixo';
    if (pontos >= 7) {
      risco = 'alto';
    } else if (pontos >= 3) {
      risco = 'medio';
    }

    return { pontos: pontos, risco: risco, sinais: sinais };
  }

  function salvarNoHistorico(base, rotulo) {
    var item = {

      data: new Date().toISOString(),
      tipo: base.tipo || '',
      tipoLabel: TIPOS[base.tipo] || 'Não informado',
      rotulo: rotulo,
      risco: base.risco || null,
      pontos: (base.pontos === undefined ? null : base.pontos),
      sinais: base.sinais || [],
      conteudo: base.conteudo || '',
      remetente: base.remetente || '',
      pedidos: base.pedidos || [],
      respostas: base.respostas || [],
      salvo: true
    };
    state.historico.unshift(item);
    return item;
  }

  function concluir(rotulo) {
    var r = state.resultadoAtual;
    if (r && !r.salvo) {
      salvarNoHistorico(r, rotulo);
      r.salvo = true;
    } else if (!r) {
      salvarNoHistorico({}, rotulo);
    }
    state.resultadoAtual = null;
    state.rascunho = novoRascunho();
    state.erros = {};
    state.erroPerguntas = '';
    state.oQueFazer = { situacao: '', concluidos: {} };
    navegar('inicio', { limpar: true });
  }

  /* =========================================================
     RENDER

  var TELAS = {
    'inicio': telaInicio,
    'informar': telaInformar,
    'perguntas': telaPerguntas,
    'resultado': telaResultado,
    'entender-sinal': telaEntenderSinal,
    'confirmar-instituicao': telaConfirmarInstituicao,
    'confirmar-pessoa': telaConfirmarPessoa,
    'o-que-fazer': telaOQueFazer,
    'canais-ajuda': telaCanaisAjuda,
    'relatar': telaRelatar,
    'avisar': telaAvisar,
    'sinais': telaSinais
  };

  var ETAPAS = {
    'informar': { n: 1, texto: 'Passo 1 de 3 · Informar a comunicação' },
    'perguntas': { n: 2, texto: 'Passo 2 de 3 · Perguntas rápidas' },
    'resultado': { n: 3, texto: 'Passo 3 de 3 · Resultado' }
  };

  function renderSubbar() {
    var t = telaAtual();
    var html = '';

    if (pilha.length > 1) {
      html += '<button type="button" class="voltar" data-action="voltar">← Voltar</button>';
    }

    if (ETAPAS[t]) {
      var pct = Math.round((ETAPAS[t].n / 3) * 100);
      html += '<div class="progresso">' +
        '<div class="barra"><span style="width:' + pct + '%"></span></div>' +
        '<span class="progresso-texto">' + ETAPAS[t].texto + '</span>' +
      '</div>';
    }

    document.getElementById('subbar').innerHTML = html;
  }

  function render() {
    var tela = telaAtual();
    var fn = TELAS[tela] || TELAS.inicio;
    var out = fn();

    document.getElementById('tela').innerHTML = out.conteudo;
    document.getElementById('acoes').innerHTML = out.acoes || '';
    renderSubbar();
  }

  /* =========================================================
     AÇÕES
     ========================================================= */

  function limparErro(campo) {
    delete state.erros[campo];
    var resumo = document.getElementById('resumo-erros');
    if (resumo) { resumo.parentNode.removeChild(resumo); }
  }

  function validarInformar() {
    var d = state.rascunho;
    var e = {};

    if (!d.tipo) { e.tipo = 'Escolha o tipo de comunicação.'; }
    if (!d.conteudo || !d.conteudo.trim()) { e.conteudo = 'Informe o conteúdo da comunicação para continuar.'; }
    if (!d.remetente) { e.remetente = 'Diga quem o remetente diz ser.'; }

    state.erros = e;

    if (Object.keys(e).length > 0) {
      render();
      window.scrollTo(0, 0);
      return;
    }
    navegar('perguntas');
  }

  function verResultado() {
    var d = state.rascunho;
    var faltam = d.respostas.filter(function (r) { return !r; }).length;

    if (faltam > 0) {
      state.erroPerguntas = 'Responda as ' + faltam + ' pergunta(s) que faltam para ver o resultado.';
      render();
      return;
    }

    state.erroPerguntas = '';
    var res = calcularResultado(d);

    state.resultadoAtual = {
      tipo: d.tipo,
      conteudo: d.conteudo,
      remetente: d.remetente,
      pedidos: d.pedidos.slice(),
      respostas: d.respostas.slice(),
      pontos: res.pontos,
      risco: res.risco,
      sinais: res.sinais,
      data: new Date().toISOString(),
      salvo: false
    };

    navegar('resultado');
  }

  function registrarResultado(valor) {
    var r = state.resultadoAtual;

    if (valor === 'legitimo') {
      if (r && !r.salvo) {
        salvarNoHistorico(r, 'Confirmado: é legítimo');
        r.salvo = true;
      }
      state.resultadoAtual = null;
      state.rascunho = novoRascunho();
      state.erros = {};
      state.erroPerguntas = '';
      state.oQueFazer = { situacao: '', concluidos: {} };
      navegar('inicio', { limpar: true });
      return;
    }

    if (r && !r.salvo) {
      salvarNoHistorico(r, valor === 'golpe' ? 'Confirmado: é golpe' : 'Não consegui confirmar');
      r.salvo = true;
    }
    state.oQueFazer = { situacao: '', concluidos: {} };
    navegar('o-que-fazer', { substituir: true });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) { return; }
    var a = el.getAttribute('data-action');

    switch (a) {

      case 'topo-inicio':
        state.resultadoAtual = null;
        navegar('inicio', { limpar: true });
        break;

      case 'topo-ajuda':
        navegar('canais-ajuda');
        break;

      case 'voltar':
        voltar();
        break;

      case 'nova-verificacao':
        state.rascunho = novoRascunho();
        state.erros = {};
        state.erroPerguntas = '';
        navegar('informar');
        break;

      case 'ja-cai':
        state.resultadoAtual = null;
        state.oQueFazer = { situacao: '', concluidos: {} };
        navegar('o-que-fazer');
        break;

      case 'abrir-sinais':
        navegar('sinais');
        break;

      case 'simular':
        var ex = EXEMPLOS[el.getAttribute('data-exemplo')];
        if (ex) {
          state.rascunho = {
            tipo: ex.tipo,
            conteudo: ex.conteudo,
            remetente: ex.remetente,
            pedidos: ex.pedidos.slice(),
            respostas: [null, null, null, null, null]
          };
          state.erros = {};
          state.erroPerguntas = '';
          navegar('informar');
        }
        break;

      case 'abrir-historico':
        var id = el.getAttribute('data-id');
        var achado = null;
        state.historico.forEach(function (item) { if (item.id === id) { achado = item; } });
        if (achado) {
          state.resultadoAtual = achado;
          navegar('resultado');
        }
        break;

      case 'set-tipo':
        state.rascunho.tipo = el.getAttribute('data-v');
        limparErro('tipo');
        render();
        break;

      case 'set-remetente':
        state.rascunho.remetente = el.getAttribute('data-v');
        limparErro('remetente');
        render();
        break;

      case 'toggle-pedido':
        var p = el.getAttribute('data-pedido');
        if (p === 'nenhum') {
          state.rascunho.pedidos = [];
        } else {
          var idx = state.rascunho.pedidos.indexOf(p);
          if (idx === -1) {
            state.rascunho.pedidos.push(p);
          } else {
            state.rascunho.pedidos.splice(idx, 1);
          }
        }
        render();
        break;

      case 'avancar-informar':
        validarInformar();
        break;

      case 'resp':
        var qi = parseInt(el.getAttribute('data-q'), 10);
        state.rascunho.respostas[qi] = el.getAttribute('data-v');
        state.erroPerguntas = '';
        render();
        break;

      case 'ver-resultado':
        verResultado();
        break;

      case 'ir-confirmar-instituicao':
        state.buscaInst = '';
        state.buscaFeita = false;
        state.instSelecionada = null;
        navegar('confirmar-instituicao');
        break;

      case 'ir-confirmar-pessoa':
        navegar('confirmar-pessoa');
        break;

      case 'ir-oque-fazer':
        state.oQueFazer = { situacao: '', concluidos: {} };
        navegar('o-que-fazer');
        break;

      case 'entender-sinal':
        navegar('entender-sinal');
        break;

      case 'encerrar':
        concluir('Encerrado com risco baixo');
        break;

      case 'buscar-inst':
        state.buscaFeita = true;
        state.instSelecionada = null;
        render();
        break;

      case 'selecionar-inst':
        var iid = el.getAttribute('data-id');
        INSTITUICOES.forEach(function (inst) {
          if (inst.id === iid) { state.instSelecionada = inst; }
        });
        render();
        break;

      case 'registrar-resultado':
        registrarResultado(el.getAttribute('data-v'));
        break;

      case 'set-situacao':
        state.oQueFazer = { situacao: el.getAttribute('data-v'), concluidos: {} };
        render();
        break;

      case 'marcar-passo':
        var pi = el.getAttribute('data-i');
        if (state.oQueFazer.concluidos[pi]) {
          delete state.oQueFazer.concluidos[pi];
        } else {
          state.oQueFazer.concluidos[pi] = true;
        }
        render();
        break;

      case 'ir-canais':
        navegar('canais-ajuda');
        break;

      case 'ir-relatar':
        state.relato.status = null;
        navegar('relatar');
        break;

      case 'ir-avisar':
        state.relato.avisoStatus = null;
        navegar('avisar');
        break;

      case 'concluir-oque-fazer':
        concluir('O que fazer agora concluído');
        break;

      case 'set-anonimo':
        state.relato.anonimo = (el.getAttribute('data-v') === 'anonimo');
        render();
        break;

      case 'toggle-falha':
        state.relato.falha = !state.relato.falha;
        state.relato.status = null;
        render();
        break;

      case 'enviar-relato':
        state.relato.status = state.relato.falha ? 'salvo' : 'enviado';
        render();
        break;

      case 'compartilhar-aviso':
        state.relato.avisoStatus = 'ok';
        render();
        break;

      default:
        break;
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    var campo = t.getAttribute('data-field');
    if (!campo) { return; }

    if (campo === 'conteudo') {
      state.rascunho.conteudo = t.value;
      if (state.erros.conteudo) {
        limparErro('conteudo');
        t.classList.remove('invalido');
        var pai = t.parentNode;
        var msg = pai.querySelector('.erro');
        if (msg) { pai.removeChild(msg); }
      }
    } else if (campo === 'aviso') {
      state.avisoTexto = t.value;
    } else if (campo === 'identificacao') {
      state.relato.identificacao = t.value;
    } else if (campo === 'busca') {
      state.buscaInst = t.value;
    }
  });

  /* ---------- início ---------- */
  render();

})();
</script>
</body>
</html>
